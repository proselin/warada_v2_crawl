language: rust

tasks:
  check:
    command: cargo check --workspace
    options:
      cache: false

  fmt:
    command: cargo fmt --all -- --check
    options:
      cache: false

  lint:
    command: cargo clippy --workspace --all-targets --all-features
    options:
      cache: false

  test:
    command: cargo test --workspace
    options:
      cache: false

  coverage:
    command: python3 scripts/rust_coverage.py
    options:
      cache: false

  build:
    command: cargo build --workspace
    options:
      cache: false

  build-release:
    command: cargo build --locked --workspace --release
    options:
      cache: true

  e2e-typecheck:
    command: npm run typecheck:e2e
    options:
      cache: false

  e2e:
    command: npm run test:e2e
    options:
      cache: false

  deps-update:
    command: cargo update
    options:
      cache: false
