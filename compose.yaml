services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123123123123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  crawl-app:
    build:
      context: .
      dockerfile: ContainerFile
    environment:
      NETTRUYEN_URL: https://nettruyenar.com
      IMAGE_BUCKET: warada-images
      IMAGE_BUCKET_TEMP_PATH: temp
      CLEANUP_ENABLED: "true"
      CLEANUP_MIN_AGE_MINUTES: "5"
      CRAWL_API_KEY: replace-with-a-long-random-secret
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: QzSyPheqDz3zJU9tnB9d
      MINIO_SECRET_KEY: RYWNL7b6EQtTN8QKdEPRdTp6oGRsU2WQTgmMTAsC
      MINIO_USE_SSL: "false"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - minio
      - redis

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  minio-data:
  redis-data:
