services:
  crawler:
    image: ${IMAGE_PREFIX:-warada}/crawler:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/Containerfile
      args:
        PACKAGE: comic_crawler
        BINARY: comic_crawler
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/db/warada.sqlite
      CRAWL_API_KEY: ${CRAWL_API_KEY:?Set CRAWL_API_KEY in infra/.env}
      NETTRUYEN_URL: ${NETTRUYEN_URL:-https://nettruyenar.com}
      IMAGE_STORAGE_DIR: /data/images
      GRPC_ADDR: 0.0.0.0:50051
      RUST_LOG: info
    volumes:
      - crawler-images:/data/images
      - sqlite-data:/data/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  auth:
    image: ${IMAGE_PREFIX:-warada}/auth:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/Containerfile
      args:
        PACKAGE: auth_service
        BINARY: auth_service
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/db/warada.sqlite
      AUTH_ADDR: 0.0.0.0:8081
      AUTH_ADMIN_API_KEY: ${AUTH_ADMIN_API_KEY:?Set AUTH_ADMIN_API_KEY in infra/.env.bak}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:?Set AUTH_PASSWORD_PEPPER in infra/.env.bak}
      JWT_PRIVATE_KEY_PATH: /run/jwt/private.pem
      JWT_PUBLIC_KEYS_DIR: /run/jwt/public
      JWT_SIGNING_KEY_ID: ${JWT_SIGNING_KEY_ID:-current}
      JWT_LEGACY_KEY_ID: ${JWT_LEGACY_KEY_ID:-current}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8080/}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-warada-api}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      RUST_LOG: info
    volumes:
      - ${JWT_SECRETS_DIR:-./secrets/jwt}:/run/jwt:ro
    depends_on:
      crawler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  display:
    image: ${IMAGE_PREFIX:-warada}/display:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/Containerfile
      args:
        PACKAGE: display_service
        BINARY: display_service
    restart: unless-stopped
    environment:
      DISPLAY_ADDR: 0.0.0.0:3001
      CRAWLER_GRPC_URL: http://crawler:50051
    depends_on:
      crawler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/playground"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: ${IMAGE_PREFIX:-warada}/frontend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/frontend.Containerfile
      args:
        APP_PACKAGE: "@warada/display-host"
        APP_PATH: ui/apps/display
        MF_ACTIVITY_REMOTE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/remotes/activity/mf-manifest.json
        MF_UI_KIT_REMOTE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/remotes/ui-kit/mf-manifest.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  activity:
    image: ${IMAGE_PREFIX:-warada}/activity:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/frontend.Containerfile
      args:
        APP_PACKAGE: "@warada/activity-remote"
        APP_PATH: ui/apps/activity-remote
        BUILD_UI_KIT: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/mf-manifest.json"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui-kit:
    image: ${IMAGE_PREFIX:-warada}/ui-kit:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/ui-kit.Containerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/mf-manifest.json"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      TOOLS_BACKEND_URL: ${TOOLS_BACKEND_URL:-http://crawler:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      auth:
        condition: service_healthy
      crawler:
        condition: service_healthy
      display:
        condition: service_healthy
      frontend:
        condition: service_healthy
      activity:
        condition: service_healthy
      ui-kit:
        condition: service_healthy

volumes:
  sqlite-data:
  crawler-images: